name: Security benchmark tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest -q
      - name: Run example evaluation
        run: python -m security_eval.cli examples/ground_truth.json examples/model_findings.json
